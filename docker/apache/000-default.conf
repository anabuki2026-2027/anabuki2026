# 【このファイルは？】
# 箱の中の Apache の設定。webroot/ を公開する場所にして、.htaccess を使えるようにする。
#
# 【担当】A チーム
# 【くわしく】docs/FILES.md

# これがないと、起動のたびに「サーバーの名前が分からない」という警告が出る
ServerName localhost

<VirtualHost *:80>
    # ブラウザから見えるのは webroot/ の中だけ（src/ や config/ は見えない）。
    # bin/cake server と同じ見え方になる。
    DocumentRoot /var/www/html/webroot

    <Directory /var/www/html/webroot>
        # webroot/.htaccess（URL の書きかえ）を使えるようにする
        AllowOverride All
        Require all granted
    </Directory>

    # ログは docker compose logs -f web で見られる
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
